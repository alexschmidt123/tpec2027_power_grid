# Conference EIG configuration. CLI budgets are recorded in each run.
system:
  name: ieee9
N: 3
data:
  observation_backend: online_continuous_swing
  uses_probe_bank: false
  uses_control_bank: false
  generate_if_missing: false
observation:
  N_obs: 0
  noise_sigma: 0.005
  sampling: signed_rocof_at_window_end
swing_equation:
  topology: ieee9
  physical_bus_count: 9
  dynamic_machine_buses:
  - 1
  - 2
  - 3
  retained_bus_map:
  - 1
  - 2
  - 3
  bus_label_conventions:
    physical_bus_numbering: one_based_ieee
    probe_bus_indexing: zero_based_physical
    observation_bus_field: one_based_physical
    control_bus_indexing: zero_based_reduced_dynamic
    reduced_index_to_physical_bus:
      0: 1
      1: 2
      2: 3
  observation_bus: 1
  base_frequency_hz: 60.0
  base_power_mva: 100.0
  coupling_strength: 1.0
  damping: 0.0
  latent_model: machinewise_mk
  M_lower_nodes:
  - 0.0877898665
  - 0.0237671385
  - 0.0111779822
  M_upper_nodes:
  - 0.1630383235
  - 0.0441389715
  - 0.0207591098
  K_lower_nodes:
  - 0.029375
  - 0.013125
  - 0.0075
  K_upper_nodes:
  - 0.29375
  - 0.13125
  - 0.075
  use_node_specific_damping: true
  D_nodes:
  - 0.01254141
  - 0.003395306
  - 0.001596855
  P_m_nodes:
  - 0.0
  - 0.0
  - 0.0
  theta0_nodes:
  - 0.0
  - 0.0
  - 0.0
  omega0_nodes:
  - 0.0
  - 0.0
  - 0.0
  enforce_initial_equilibrium: true
  probe_buses:
  - 0
  probe_amplitudes:
  - 0.05
  reset_after_probe: false
  T_obs_sec: 3.5
  ode_dt: 0.0015625
  fs_hz: 40.0
  sigma: 0.2
  probe_duration_bounds:
  - 0.2
  - 3.0
prior:
  mc_samples: 512
  mc_support_seed: 1
experiment:
  mode: continuous_duration_no_reset
  experiment_type: eig_based
  step_number: 3
  methods:
  - dad
  - rl_sboed
  - step_dad
  - myopic
  - fixed
  - random
  min_duration_separation: 0.01
nonreset_backend_status: implemented_ieee9
training:
  eig_based:
    updates: 2000
    batch_size: 64
